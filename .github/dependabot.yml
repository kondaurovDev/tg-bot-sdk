# The published packages have no third-party runtime dependencies; everything
# here is the tooling, the website and the demo. One grouped pull request a
# week keeps the lockfile clear of advisories without a pull request per package.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The same week-long hold as for actions (.github/pinact.yml): a release
    # that turns out to be compromised is usually caught within days.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors come one at a time: each may need changes here.
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)
