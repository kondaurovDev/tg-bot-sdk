name: Bug report
description: Something works differently from the docs, or does not work
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@effect-ak/tg-bot"
        - "@effect-ak/tg-bot-client"
        - "@effect-ak/tg-bot-api"
        - "@effect-ak/tg-bot-emulator"
        - Documentation site or playground
        - Demo bot
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, from `npm ls @effect-ak/tg-bot` or your lockfile
      placeholder: 1.14.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Where the code runs
      placeholder: Node.js 24, Cloudflare Workers, Bun, Deno, a browser
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code that shows it
      description: The smallest bot or call that reproduces the problem. Remove your bot token.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: The error (`result.error` for a client call), a log, or the response Telegram sent
      render: text
