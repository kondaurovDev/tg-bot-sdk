name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request makes the older run moot. On main every
  # run counts: Release and Deploy Demo start from it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      # Codegen ran from the committed docs snapshot as part of the build. Any
      # change it made means the committed generated files are stale: the
      # codegen changed without a regeneration, or the snapshot was edited.
      - name: Generated files are up to date
        run: git diff --exit-code

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Guard hook tests
        run: node --test .claude/hooks/guard.test.ts

  actions-pinned:
    name: Actions are pinned
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validate only: fails when an action is not pinned to a commit SHA.
      # Pin locally with `pinact run` (config: .github/pinact.yml).
      - name: Check pins
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
