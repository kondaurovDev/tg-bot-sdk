name: Deploy Demo Bot

# After every green Build of a push to main — the SDK and the demo's own tests
# have passed — or by hand.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-demo

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: pnpm --filter example exec wrangler

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Build tested, not whatever main points at by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm --filter @effect-ak/tg-bot-api gen && pnpm --filter "./packages/**" build

      - name: Deploy Worker
        id: deploy
        run: |
          $WRANGLER deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$url" ]; then echo "::error::could not find worker URL in deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Push bot secrets
        run: |
          printf '%s' "$DEMO_BOT_TOKEN" | $WRANGLER secret put BOT_TOKEN
          printf '%s' "$DEMO_WEBHOOK_SECRET" | $WRANGLER secret put WEBHOOK_SECRET
        env:
          DEMO_BOT_TOKEN: ${{ secrets.DEMO_BOT_TOKEN }}
          DEMO_WEBHOOK_SECRET: ${{ secrets.DEMO_WEBHOOK_SECRET }}

      - name: Register Telegram webhook
        # `wrangler secret put` rolls out a new Worker version; the first
        # requests after it may still hit the previous one (403 on a fresh
        # Worker that had no secrets yet), so retry for a short while.
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              -H "X-Telegram-Bot-Api-Secret-Token: $DEMO_WEBHOOK_SECRET" \
              "${{ steps.deploy.outputs.url }}/setup"; then
              echo
              echo "Webhook set to ${{ steps.deploy.outputs.url }}/webhook"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::/setup kept failing — check that DEMO_WEBHOOK_SECRET matches the deployed WEBHOOK_SECRET"
          exit 1
        env:
          DEMO_WEBHOOK_SECRET: ${{ secrets.DEMO_WEBHOOK_SECRET }}

      # Name the bot in the run's summary (and as an annotation), so the
      # deploy says whom to write to. A failed lookup does not fail the
      # deploy, which has already succeeded by now.
      - name: Summary
        run: |
          if ! me=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            "https://api.telegram.org/bot${DEMO_BOT_TOKEN}/getMe"); then
            echo "::warning::getMe failed — the bot's name is not in the summary"
            exit 0
          fi
          username=$(jq -r '.result.username' <<<"$me")
          echo "::notice title=Demo bot::https://t.me/${username}"
          {
            echo "### Demo bot deployed"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Bot | [@${username}](https://t.me/${username}) |"
            echo "| Worker | ${WORKER_URL} |"
            echo "| Commit | \`${COMMIT:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEMO_BOT_TOKEN: ${{ secrets.DEMO_BOT_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
