procs:
  website:
    shell: pnpm --filter tg-bot-website dev
    autostart: true
  deploy-website:
    shell: pnpm --filter tg-bot-website run deploy
    autostart: false
    autorestart: false
  test:
    shell: pnpm test
    autostart: false
    autorestart: false
  typecheck:
    shell: pnpm typecheck
    autostart: false
    autorestart: false
