<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Source of public/og-banner.png, the link preview image. Render at 1200x630. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1621"/>
      <stop offset="1" stop-color="#16243A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2AA5E6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2AA5E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB4EC"/>
      <stop offset="1" stop-color="#1A8CC8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="215" rx="190" ry="150" fill="url(#glow)"/>
  <!-- The logo, 112 px -->
  <g transform="translate(544 159) scale(1.75)">
    <rect width="64" height="64" rx="14" fill="url(#bg)"/>
    <path d="M15 24 L8 32 L15 40" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M49 24 L56 32 L49 40" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M43 17 L18 29 L28 33 Z" fill="#fff"/>
    <path d="M43 17 L28 33 L33 46 Z" fill="#fff" opacity="0.82"/>
    <path d="M28 33 L30.5 40 L33 46 L31 36 Z" fill="#0F6E9F" opacity="0.35"/>
  </g>
  <text x="600" y="370" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1">Telegram Bot SDK</text>
  <text x="600" y="432" text-anchor="middle" fill="#5CC0F2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500">Type-safe client, generated Bot API types, a bot runner</text>
  <text x="600" y="472" text-anchor="middle" fill="#5CC0F2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500">and an in-memory emulator — zero dependencies</text>
  <text x="600" y="560" text-anchor="middle" fill="#7F93A8" font-family="ui-monospace, Menlo, monospace" font-size="22">tg-bot-sdk.website</text>
</svg>
